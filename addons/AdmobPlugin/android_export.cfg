; Squishy Merge — AdMob configuration (M8.9-01, M9-01). Read by THREE consumers:
;
;   1. addons/AdmobPlugin/AdmobPlugin.gd (export plugin, upstream v6.0):
;      [General] is_real, [Debug] app_id, [Release] app_id
;      -> the chosen app_id is written into AndroidManifest.xml as
;         com.google.android.gms.ads.APPLICATION_ID at export time.
;   2. scripts/ads/ad_config.gd (runtime) — M9-01: the BUILD TYPE picks the ids:
;        debug build   -> ONLY the [Debug] Google sample ids (a non-sample id here
;                         makes the config invalid: a debug/QA build can never
;                         request a live ad unit);
;        release build -> ONLY the four [Release] ids AND is_real=true; empty,
;                         malformed, Google-sample, mixed-publisher or duplicate
;                         ids make the config invalid -> no ads at all.
;      [Debug] debug_geography (eea | not_eea | regulated_us_state | other |
;      disabled) is honoured ONLY in debug builds.
;   3. tools/release/release_readiness.gd (release gate) — same rules, plus the
;      [Audience] decision.
;
; TEST CONFIGURATION — is_real=false. Every id under [Debug] is Google's
; official sample/demo id (developers.google.com/admob/android/test-ads,
; read 2026-09-21). They may be committed; they never serve live ads.
;
; PRODUCTION (owner, release step): fill the four [Release] keys from the
; AdMob console, then set is_real=true. App/ad-unit ids are not secrets (they
; ship inside every APK). Do not put anything secret here.

[General]

is_real=false

[Debug]

app_id="ca-app-pub-3940256099942544~3347511713"
rewarded_id="ca-app-pub-3940256099942544/5224354917"
banner_id="ca-app-pub-3940256099942544/9214589741"
interstitial_id="ca-app-pub-3940256099942544/1033173712"

[Release]

app_id=""
rewarded_id=""
banner_id=""
interstitial_id=""

[Audience]

; PRODUCT AUDIENCE — OWNER DECISION, FINAL (2026-09-25): 13+ general audience;
; NOT designed or marketed for children under 13. Google Play target age groups:
; 13-15, 16-17, 18+ (5 and under / 6-8 / 9-12 NOT selected). This does NOT mean
; Families can never apply: Google says 13-15 and 16-17 may count as children in
; some locales, so Families / child-privacy / ad obligations depend on where the
; app is distributed. Record + policy notes: docs/monetization/AUDIENCE_DECISION.md.
; decision: general_13_plus (chosen) | mixed_audience | child_directed |
; "" (no decision -> release export refused). Only general_13_plus needs no
; extra code; the release gate blocks the other two (CODE).
; This decision did NOT change the three values below: every ad request sends
; what it has sent since M8.9 (TFCD/TFUA not sent, max content rating G).
; "unspecified" is NOT teen (TEEN) treatment, and GMA 24.9.0 cannot send TFAT
; TEEN. The 13-17 ad-treatment / jurisdiction strategy is OPEN before production
; (release gate: separate OWNER blocker, AUDIENCE_DECISION.md §2.2).
decision="general_13_plus"
tag_for_child_directed_treatment="unspecified"
tag_for_under_age_of_consent="unspecified"
max_ad_content_rating="G"
