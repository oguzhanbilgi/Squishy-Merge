; Squishy Merge — AdMob configuration (M8.9-01, M9-01). Read by THREE consumers:
;
;   1. addons/AdmobPlugin/AdmobPlugin.gd (export plugin, upstream v6.0):
;      [General] is_real, [Debug] app_id, [Release] app_id
;      -> the chosen app_id is written into AndroidManifest.xml as
;         com.google.android.gms.ads.APPLICATION_ID at export time.
;   2. scripts/ads/ad_config.gd (runtime) — M9-01: the BUILD TYPE picks the ids:
;        debug build   -> ONLY the [Debug] Google sample ids (a non-sample id here
;                         makes the config invalid: a debug/QA build can never
;                         request a live ad unit);
;        release build -> ONLY the four [Release] ids AND is_real=true; empty,
;                         malformed, Google-sample, mixed-publisher or duplicate
;                         ids make the config invalid -> no ads at all.
;      [Debug] debug_geography (eea | not_eea | regulated_us_state | other |
;      disabled) is honoured ONLY in debug builds.
;   3. tools/release/release_readiness.gd (release gate) — same rules, plus the
;      [Audience] decision.
;
; TEST CONFIGURATION — is_real=false. Every id under [Debug] is Google's
; official sample/demo id (developers.google.com/admob/android/test-ads,
; read 2026-09-21). They may be committed; they never serve live ads.
;
; PRODUCTION (owner, release step): fill the four [Release] keys from the
; AdMob console, then set is_real=true. App/ad-unit ids are not secrets (they
; ship inside every APK). Do not put anything secret here.

[General]

is_real=false

