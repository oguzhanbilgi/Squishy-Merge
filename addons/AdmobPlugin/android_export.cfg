; Squishy Merge — AdMob configuration (M8.9-01). Read by TWO consumers:
;
;   1. addons/AdmobPlugin/AdmobPlugin.gd (export plugin, upstream v6.0):
;      [General] is_real, [Debug] app_id, [Release] app_id
;      -> the chosen app_id is written into AndroidManifest.xml as
;         com.google.android.gms.ads.APPLICATION_ID at export time.
;   2. scripts/ads/ad_config.gd (runtime): the same is_real flag plus the
;      *_id ad-unit keys below (the export plugin ignores extra keys).
;
; TEST CONFIGURATION — is_real=false. Every id under [Debug] is Google's
; official sample/demo id (developers.google.com/admob/android/test-ads,
; read 2026-09-21). They may be committed; they never serve live ads.
;
; PRODUCTION (later release/config step, owner): set is_real=true and fill
; the [Release] keys from the AdMob console. AdConfig refuses to run ads
; when is_real=true and any [Release] key is empty (no silent fallback to
; test ids in a real build). Do not put anything secret here — app ids and
; ad-unit ids ship inside every APK anyway.

[General]

is_real=false

[Debug]

